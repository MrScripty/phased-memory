name: deterministic
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - run: cargo +1.99.1 fmt --all -- --check
      - run: cargo +1.99.1 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.99.1 test --locked
      - run: python3 scripts/verify_original_pack.py
